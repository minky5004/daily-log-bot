name: daily-log

# dry-run 은 아무것도 올리지 않고 초록으로 끝난다 — 목록에서 발행과 같은 줄로 보이면
# 「어제치는 올라갔나」를 실행 목록으로 답할 수 없다
run-name: daily-log${{ inputs.date && format(' {0}', inputs.date) || '' }}${{ inputs.dry_run == true && ' (dry-run)' || '' }}

on:
  # KST 자정 무렵(15:07 UTC). 정각을 피하는 것은 매시 정각이 액션 예약의 가장 혼잡한 슬롯이라
  # 지연·드롭이 잦기 때문 — 대상이 "어제" 라 몇 분 밀려도 수집 창이 같아, 오프셋은 발화 신뢰도만
  # 올리고 결과는 그대로다(DayWindow 참고).
  # schedule 은 기본 브랜치의 워크플로만 발화하므로 dev 머지 전에는 예약이 걸리지 않는다
  schedule:
    # 이 값을 바꾸면 alert 잡의 FIRST_SCHEDULE 도 함께 — 1차 실패를 알림에서 빼는 판정이 이 문자열이다
    - cron: '7 15 * * *'
    # 90분 뒤 한 번 더. 상류 일시 장애로 1차가 죽은 날을 덮는다 — Gemini 503 이 8/19 · 8/22
    # 이틀을 날렸고, 되살린 것은 둘 다 수동 실행이라 사람이 알아챌 때까지 그날이 비어 있었다.
    # 두 번째 발화도 KST 로는 같은 날 01:37 이라 수집 대상은 1차와 같은 하루다.
    # 1차가 성공한 날에는 Uploader 가 li.session 을 보고 업로드만 건너뛰어 기록이 둘로 갈리지
    # 않는다. 프로세스 안 재시도(GeminiClient 의 5xx)는 몇 분짜리 스파이크만 넘기므로 이쪽은
    # 새 러너다 — 크래시·네트워크 단절·한 시간 넘는 과부하까지 덮는다
    - cron: '37 16 * * *'
  # 실패한 날 되돌리기 · 사이클마다 러너를 밟는 수동 통로
  workflow_dispatch:
    inputs:
      date:
        # 어제만 되던 때는 결번의 시한이 이튿날 자정이었다 — 9/25 는 그 시한을 넘겨 되살릴 길이 없었다
        description: '대상 날짜 YYYY-MM-DD (KST) — 비우면 어제 · 오늘 이후는 거부'
        type: string
        required: false
      dry_run:
        # 이미 올라간 날은 요약 앞 판정이 끊어 마크다운이 만들어지지 않는다. 본문 형식을
        # 고치는 사이클의 검증 통로가 그 출력뿐이라, 판정과 업로드만 건너뛰는 실행을 둔다
        description: '올리지 않고 마크다운만 찍는다 — 본문 형식 · 문체 확인용'
        type: boolean
        default: false

# 하는 일은 소스 읽기와 외부 호출뿐. 기본값은 리포 설정에 따라 쓰기까지 열린다
permissions:
  contents: read

# 발화가 둘이 된 뒤로 크게 밀린 1차와 백업이 나란히 뜰 수 있다. study-log 의 중복 판정은
# 읽고 나서 넣는 두 걸음이라(NoteWriter 의 existsBy... 뒤 저장) 둘이 같이 통과하면 같은 하루가
# 기록 둘이 된다 — 앞선 실행을 죽이지 않고 줄을 세운다.
# dry-run 만 제 실행 번호로 빠지는 것은 대기 중인 발행을 밀어내지 않기 위해서다: 한 그룹에서
# 대기할 수 있는 것은 하나뿐이라, 형식을 고치며 연달아 띄우는 dry-run 이 그 자리의 예약 발행을
# 취소한다. 아무것도 쓰지 않는 실행이라 발행과 나란히 돌아도 무해하다
concurrency:
  group: daily-log-${{ inputs.dry_run == true && github.run_id || 'publish' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 외부 API 응답을 기다리다 멈추면 기본 상한 6시간까지 러너를 붙잡는다.
    # 28분은 study-log 왕복의 이론 최악(첫 GET 3회 · 나머지 다섯 요청 각 1회 · 요청 상한 120초 =
    # 16분)에 Gemini 최악(5xx 3회 · 폴백 모델 1회 · 요청 상한 120초 · 사이 대기 30초·60초 = 9분 30초)과
    # 빌드·셋업을 더한 값이다 — 이 상한이 최악보다 낮으면 러너가 POST /import 직전에 잡을 죽여 그날이 빈다
    timeout-minutes: 28
    outputs:
      date: ${{ steps.day.outputs.date }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 매 실행마다 도는 Gradle 빌드가 이 스택의 대가라, 캐시는 선택이 아니라 전제다.
      # v6 은 캐시를 별도 약관이 붙는 비공개 컴포넌트로 분리 — 라이선스 판단이라 v5 유지
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      # 대상 날짜를 여기서 한 번 정하고 봇 · 알림이 같은 값을 쓴다 — 따로 지으면 자정 전에 시작한
      # 실행에서 둘이 하루 어긋난다. 규칙은 DayWindow.target 과 같다(봇도 한 번 더 판정)
      - name: Target date
        id: day
        env:
          REQUESTED: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED" ]; then
            # date 가 되돌려 준 표기와 같아야 한다 — 2026-9-25 같은 느슨한 표기는 제목 판정을 가른다
            D=$(date -d "$REQUESTED" +%Y-%m-%d 2>/dev/null)
            if [ "$D" != "$REQUESTED" ]; then
              echo "::error::날짜 형식은 YYYY-MM-DD — 받은 값 $REQUESTED"
              exit 1
            fi
            if [ ! "$D" \< "$(TZ=Asia/Seoul date +%Y-%m-%d)" ]; then
              echo "::error::KST 오늘 이전 날짜만 — 받은 값 $D"
              exit 1
            fi
          else
            D=$(TZ=Asia/Seoul date -d yesterday +%Y-%m-%d)
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"

      # 빌드와 나누는 것은 컴파일 실패와 실행 실패를 로그의 같은 자리에서 보지 않기 위해서
      # 자동 발급되는 GITHUB_TOKEN 은 이 리포에만 닿아 계정 전체 · private 조회가 되지 않는다
      - name: Run
        run: ./gradlew run --quiet
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDYLOG_BASE_URL: ${{ vars.STUDYLOG_BASE_URL }}
          STUDYLOG_USERNAME: ${{ secrets.STUDYLOG_USERNAME }}
          STUDYLOG_PASSWORD: ${{ secrets.STUDYLOG_PASSWORD }}
          # schedule 발화에는 inputs 가 없어 빈 문자열이 온다 — 켜지는 것은 사람이 켠 실행뿐
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_DATE: ${{ steps.day.outputs.date }}

  # 결번이 확정된 실행을 사람에게 알리고, 그 날짜가 살아나면 닫는다. 9/25 는 1차 · 백업 둘 다
  # 죽었는데 알림이 없어 이튿날 밤 우연히 발견했다 — 그때는 되살릴 시한이 거의 끝난 시각이었다.
  alert:
    needs: run
    # 취소까지 받는다 — timeout-minutes 에 걸린 실행은 실패가 아니라 취소로 끝나는데 결번은 같다.
    # dry-run 은 아무것도 올리지 않는 실행이라 결번과도 복구와도 무관하다
    if: >-
      always()
      && needs.run.result != 'skipped'
      && inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 실패 이슈 열기 · 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.run.result }}
          DATE: ${{ needs.run.outputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 위 schedule 의 1차 값과 같아야 한다
          FIRST_SCHEDULE="7 15 * * *"

          # 날짜 단계에 닿기 전에 죽으면(빌드 실패 등) 출력이 비어 있다 — 그때만 지금 시각으로 짓는다.
          # 손으로 준 날짜가 거부된 실행은 열지 않는다 — 결번이 아니라 입력 오류고, 돌린 사람이 보고 있다
          if [ -z "$DATE" ]; then
            if [ -n "$REQUESTED" ]; then
              echo "손으로 준 날짜 $REQUESTED 의 실행 — 날짜가 정해지기 전에 끝나 이슈는 열지 않는다"
              exit 0
            fi
            DATE=$(TZ=Asia/Seoul date -d yesterday +%Y-%m-%d)
          fi
          TITLE="TIL 발행 실패 — $DATE"

          # 검색은 후보를 좁히는 데만 쓰고 판정은 제목 완전 일치로 한다 — 검색은 낱말 단위라
          # 날짜가 쪼개져 다른 날의 열린 이슈가 걸린다(ai-cards-news 에서 겪은 자리)
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number")

          # 살아난 날은 닫는다 — 열린 이슈 목록이 "지금 결번인 날" 만 가리키게
          if [ "$RESULT" = "success" ]; then
            for n in $OPEN; do
              gh issue close "$n" --comment "$RUN_URL 실행으로 $DATE 복구."
            done
            exit 0
          fi

          # 1차 실패에는 열지 않는다 — 90분 뒤 백업이 같은 하루를 다시 돈다. 순서가 뒤바뀐 날도
          # 백업의 실패가 먼저 이슈를 연다. 대가는 GitHub 이 백업 예약을 떨군 날 하나 — 그날은
          # 1차의 실패가 마지막인데 이슈가 없다. 1차마다 열면 503 이 잦은 시기에 매일 쌓이는 소음이다
          if [ "$SCHEDULE" = "$FIRST_SCHEDULE" ]; then
            echo "$DATE 1차 실패 — 백업 발화가 다시 돈다. 이슈는 열지 않는다"
            exit 0
          fi

          if [ -n "$OPEN" ]; then
            echo "$TITLE 이슈가 이미 열려 있다 — 새로 만들지 않는다"
            exit 0
          fi

          gh issue create --title "$TITLE" --label bug --body "$DATE (KST) 하루치 TIL 이 study-log 에 올라가지 않았다.

          실행 로그: $RUN_URL

          Actions → daily-log → Run workflow · date 에 \`$DATE\` · dry_run 끔. 이미 올라간 날은 요약 앞에서 건너뛰므로
          중복 기록은 생기지 않고, 성공하면 이 이슈는 자동으로 닫힌다. 사유가 Gemini 503 이면
          과부하가 풀린 뒤에 돌린다 — 실패한 요청도 하루 한도(20회)를 센다."
