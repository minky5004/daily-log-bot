name: daily-log

on:
  # KST 자정 무렵(15:07 UTC). 정각을 피하는 것은 매시 정각이 액션 예약의 가장 혼잡한 슬롯이라
  # 지연·드롭이 잦기 때문 — 대상이 "어제" 라 몇 분 밀려도 수집 창이 같아, 오프셋은 발화 신뢰도만
  # 올리고 결과는 그대로다(DayWindow 참고).
  # schedule 은 기본 브랜치의 워크플로만 발화하므로 dev 머지 전에는 예약이 걸리지 않는다
  schedule:
    - cron: '7 15 * * *'
    # 90분 뒤 한 번 더. 상류 일시 장애로 1차가 죽은 날을 덮는다 — Gemini 503 이 8/19 · 8/22
    # 이틀을 날렸고, 되살린 것은 둘 다 수동 실행이라 사람이 알아챌 때까지 그날이 비어 있었다.
    # 두 번째 발화도 KST 로는 같은 날 01:37 이라 수집 대상은 1차와 같은 하루다.
    # 1차가 성공한 날에는 Uploader 가 li.session 을 보고 업로드만 건너뛰어 기록이 둘로 갈리지
    # 않는다. 프로세스 안 재시도가 아니라 새 러너인 것은 크래시·네트워크 단절까지 덮기 때문
    - cron: '37 16 * * *'
  # 실패한 날 되돌리기 · 사이클마다 러너를 밟는 수동 통로
  workflow_dispatch:

# 하는 일은 소스 읽기와 외부 호출뿐. 기본값은 리포 설정에 따라 쓰기까지 열린다
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 외부 API 응답을 기다리다 멈추면 기본 상한 6시간까지 러너를 붙잡는다
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 매 실행마다 도는 Gradle 빌드가 이 스택의 대가라, 캐시는 선택이 아니라 전제다.
      # v6 은 캐시를 별도 약관이 붙는 비공개 컴포넌트로 분리 — 라이선스 판단이라 v5 유지
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      # 빌드와 나누는 것은 컴파일 실패와 실행 실패를 로그의 같은 자리에서 보지 않기 위해서
      # 자동 발급되는 GITHUB_TOKEN 은 이 리포에만 닿아 계정 전체 · private 조회가 되지 않는다
      - name: Run
        run: ./gradlew run --quiet
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDYLOG_BASE_URL: ${{ vars.STUDYLOG_BASE_URL }}
          STUDYLOG_USERNAME: ${{ secrets.STUDYLOG_USERNAME }}
          STUDYLOG_PASSWORD: ${{ secrets.STUDYLOG_PASSWORD }}
